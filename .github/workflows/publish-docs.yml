name: Publish docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch fonts (Poppins, IBM Plex Mono)
        run: |
          mkdir -p fern/assets/fonts /tmp/fonts && cd /tmp/fonts
          npm pack @fontsource/poppins@5.3.0 @fontsource/ibm-plex-mono@5.3.0 > /dev/null
          for t in *.tgz; do tar xzf "$t"; cp package/files/*-latin-*-normal.woff2 "$GITHUB_WORKSPACE/fern/assets/fonts/"; rm -rf package; done
          ls "$GITHUB_WORKSPACE/fern/assets/fonts"
      - name: Install Fern CLI
        run: npm install -g fern-api
      - name: Check
        run: fern check
      - name: Publish
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --docs
