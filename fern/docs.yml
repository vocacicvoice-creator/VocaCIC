instances:
  - url: vocacic.docs.buildwithfern.com

title: Voca CIC Docs

favicon: ./assets/favicon.png

css: ./styles.css

colors:
  accentPrimary: "#6C5CE0"
  background: "#FFFFFF"
  border: "#E3E8F0"
  header-background: "#FFFFFF"
  sidebar-background: "#FFFFFF"
  card-background: "#F4F6FA"

typography:
  bodyFont:
    name: Poppins
    paths:
      - path: ./assets/fonts/poppins-latin-300-normal.woff2
        weight: 300
        style: normal
      - path: ./assets/fonts/poppins-latin-400-normal.woff2
        weight: 400
        style: normal
      - path: ./assets/fonts/poppins-latin-500-normal.woff2
        weight: 500
        style: normal
      - path: ./assets/fonts/poppins-latin-600-normal.woff2
        weight: 600
        style: normal
      - path: ./assets/fonts/poppins-latin-700-normal.woff2
        weight: 700
        style: normal
  headingsFont:
    name: Poppins
    paths:
      - path: ./assets/fonts/poppins-latin-500-normal.woff2
        weight: 500
        style: normal
      - path: ./assets/fonts/poppins-latin-600-normal.woff2
        weight: 600
        style: normal
      - path: ./assets/fonts/poppins-latin-700-normal.woff2
        weight: 700
        style: normal
  codeFont:
    name: IBM Plex Mono
    paths:
      - path: ./assets/fonts/ibm-plex-mono-latin-500-normal.woff2
        weight: 500
        style: normal
      - path: ./assets/fonts/ibm-plex-mono-latin-600-normal.woff2
        weight: 600
        style: normal

layout:
  searchbar-placement: header
  tabs-placement: header

theme:
  tabs:
    style: bubble

landing-page:
  page: Home
  path: ./pages/home.mdx

tabs:
  admin-guide:
    display-name: Admin Guide
    icon: fa-solid fa-user-gear
    skip-slug: true
  flow-designer:
    display-name: Flow Designer
    icon: fa-solid fa-diagram-project
    skip-slug: true
  worker-app:
    display-name: Worker App
    icon: fa-solid fa-headset
    skip-slug: true

